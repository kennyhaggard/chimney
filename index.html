    pitch: 0.5,
    rotation: 0,
    tiles: true,
    downhill: 'eave',
    visible: { under: true, above: true, corner: true, cone: true, opening: true }
  };

  const dims = {
    curbW: 27.559,
    curbD: 38,
    curbH: 6,
    frameT: 2,
    underApron: 8,
    sideUnderApron: 16,
    underLeg: 6,
    aboveCap: 2,
    aboveDrop: 5,
    aboveApron: 8,
    backPanDepth: 16,
    backPanOutlet: 16,
    tileHoldback: 5,
    sideOutletLength: 6,
    eaveSideWing: 16,
    eaveHem: 1,
    tab: 3,
    roofW: 86,
    roofD: 82
  };

  let viewportW = 736;
  let viewportH = 570;
  let scale = 5;
  let originX = 360;
  let originY = 350;
  let dragState = null;
  let pendingRotation = null;
  let rotationFrame = 0;

  const el = (name, attrs = {}, parent = scene) =&gt; {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
    parent.appendChild(node);
    return node;
  };

  const roofZ = y =&gt; y * state.pitch;
  const tx = (p, delta) =&gt; [p[0] + delta[0], p[1] + delta[1], p[2] + delta[2]];
  const viewPoint = p =&gt; {
    const a=state.rotation*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
    return [p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]];
  };
  const project = p =&gt; {
    const q=viewPoint(p);
    return {
      x: originX + scale * (q[0] - q[1]) * 0.8660254,
      y: originY + scale * ((q[0] + q[1]) * 0.5 - q[2])
    };
  };
  const pointString = points =&gt; points.map(p =&gt; {
    const q = project(p);
    return `${q.x.toFixed(1)},${q.y.toFixed(1)}`;
  }).join(' ');

  const faces = [];
  const addFace = (points, part, fill, opacity = 1, extra = {}) =&gt; {
    faces.push({ points, part, fill, opacity, ...extra });
  };
  const roofRect = (x1, x2, y1, y2, lift = 0) =&gt; [
    [x1, y1, roofZ(y1) + lift], [x2, y1, roofZ(y1) + lift],
    [x2, y2, roofZ(y2) + lift], [x1, y2, roofZ(y2) + lift]
  ];
  const raisedRect = (x1, x2, y1, y2, lift) =&gt; roofRect(x1, x2, y1, y2, lift);
  const translated = (points, delta) =&gt; points.map(p =&gt; tx(p, delta));

  function buildRoof() {
    const w = dims.roofW / 2, d = dims.roofD / 2;
    const cw = dims.curbW / 2, cd = dims.curbD / 2;
    if (state.visible.opening) addFace(roofRect(-cw,cw,-cd,cd,-.65), 'opening', 'var(--orange)', .42);
    addFace(roofRect(-w, -cw, -d, d), 'roof', 'var(--muted)', .55);
    addFace(roofRect(cw, w, -d, d), 'roof', 'var(--muted)', .55);
    addFace(roofRect(-cw, cw, -d, -cd), 'roof', 'var(--muted)', .55);
    addFace(roofRect(-cw, cw, cd, d), 'roof', 'var(--muted)', .55);

    if (!state.tiles) return;
    const tileW = 10, tileD = 14, gap = .7;
    for (let y = -d + 1; y &lt; d - tileD; y += tileD) {
      const offset = (Math.round((y + d) / tileD) % 2) * tileW / 2;
      for (let x = -w - tileW + offset; x &lt; w; x += tileW) {
        const x1 = x + gap / 2, x2 = Math.min(x + tileW - gap / 2, w - .5);
        const y1 = y + gap / 2, y2 = Math.min(y + tileD - gap / 2, d - .5);
        const clear = x2 &lt; -cw - .5 || x1 &gt; cw + .5 || y2 &lt; -cd - .5 || y1 &gt; cd + .5;
        const obstructsBacker = x2 &gt; -cw-dims.backPanOutlet &amp;&amp; x1 &lt; cw+dims.backPanOutlet &amp;&amp; y2 &gt; cd &amp;&amp; y1 &lt; cd+dims.tileHoldback;
        const eaveApronZone = state.downhill==='eave' &amp;&amp; x2 &gt; -cw-dims.eaveSideWing &amp;&amp; x1 &lt; cw+dims.eaveSideWing &amp;&amp; y2 &lt;= -cd+.5;
        if (clear &amp;&amp; !obstructsBacker &amp;&amp; !eaveApronZone &amp;&amp; x2 &gt; -w &amp;&amp; x1 &lt; w) addFace(roofRect(Math.max(x1,-w), x2, y1, y2, .35), 'tile', 'var(--viz-series-2)', .14);
      }
    }
  }

  function buildCurb() {
    const w = dims.curbW / 2, d = dims.curbD / 2, h = dims.curbH;
    addFace([[-w,-d,roofZ(-d)],[w,-d,roofZ(-d)],[w,-d,roofZ(-d)+h],[-w,-d,roofZ(-d)+h]], 'curb', 'var(--viz-series-3)', .38);
    addFace([[w,-d,roofZ(-d)],[w,d,roofZ(d)],[w,d,roofZ(d)+h],[w,-d,roofZ(-d)+h]], 'curb', 'var(--viz-series-3)', .3);
    addFace([[-w,d,roofZ(d)],[-w,-d,roofZ(-d)],[-w,-d,roofZ(-d)+h],[-w,d,roofZ(d)+h]], 'curb', 'var(--viz-series-3)', .28);
    addFace([[w,d,roofZ(d)],[-w,d,roofZ(d)],[-w,d,roofZ(d)+h],[w,d,roofZ(d)+h]], 'curb', 'var(--viz-series-3)', .25);
    const t = dims.frameT;
    addFace(raisedRect(-w,w,-d,-d+t,h), 'curb', 'var(--viz-series-3)', .52);
    addFace(raisedRect(-w,w,d-t,d,h), 'curb', 'var(--viz-series-3)', .48);
    addFace(raisedRect(-w,-w+t,-d+t,d-t,h), 'curb', 'var(--viz-series-3)', .45);
    addFace(raisedRect(w-t,w,-d+t,d-t,h), 'curb', 'var(--viz-series-3)', .45);
  }

  function buildUnder() {
    if (!state.visible.under) return;
    const w = dims.curbW/2, d = dims.curbD/2, a = dims.underApron, sideA = dims.sideUnderApron, leg = dims.underLeg, tab = dims.tab;
    const e = state.exploded ? 1 : 0;
    const topLift=.32, bottomLift=.08, sideLift=.20;
    const bottomY1=state.downhill==='eave'?-dims.roofD/2:-d-a;
    const bottomSideExtension=state.downhill==='eave'?dims.eaveSideWing:tab;
    const bottomDelta=[0,-6*e,1*e];
    const sideOutlet=dims.sideOutletLength;
    const leftSidePan=state.downhill==='eave' ? [
      [-w-sideA,-d-sideOutlet,roofZ(-d-sideOutlet)+sideLift],
      [-w+tab,-d-sideOutlet,roofZ(-d-sideOutlet)+sideLift],
      [-w+tab,-d+1,roofZ(-d+1)+sideLift],
      [-w,-d+1,roofZ(-d+1)+sideLift],
      [-w,d+tab,roofZ(d+tab)+sideLift],
      [-w-sideA,d+tab,roofZ(d+tab)+sideLift]
    ] : roofRect(-w-sideA,-w,-d-tab,d+tab,sideLift);
    const rightSidePan=state.downhill==='eave' ? [
      [w-tab,-d-sideOutlet,roofZ(-d-sideOutlet)+sideLift],
      [w+sideA,-d-sideOutlet,roofZ(-d-sideOutlet)+sideLift],
      [w+sideA,d+tab,roofZ(d+tab)+sideLift],
      [w,d+tab,roofZ(d+tab)+sideLift],
      [w,-d+1,roofZ(-d+1)+sideLift],
      [w-tab,-d+1,roofZ(-d+1)+sideLift]
    ] : roofRect(w,w+sideA,-d-tab,d+tab,sideLift);
    const parts = [
      {
        delta:bottomDelta,
        paint:3,
        horiz:roofRect(-w-bottomSideExtension,w+bottomSideExtension,bottomY1,-d,bottomLift),
        vert:[[w+tab,-d,roofZ(-d)+bottomLift],[-w-tab,-d,roofZ(-d)+bottomLift],[-w-tab,-d,roofZ(-d)+leg+bottomLift],[w+tab,-d,roofZ(-d)+leg+bottomLift]]
      },
      {
        delta:[-6*e,0,5*e],
        paint:5,
        horiz:leftSidePan,
        vert:[[-w,-d-tab,roofZ(-d-tab)+sideLift],[-w,d+tab,roofZ(d+tab)+sideLift],[-w,d+tab,roofZ(d+tab)+leg+sideLift],[-w,-d-tab,roofZ(-d-tab)+leg+sideLift]]
      },
      {
        delta:[6*e,0,5*e],
        paint:5,
        horiz:rightSidePan,
        vert:[[w,d+tab,roofZ(d+tab)+sideLift],[w,-d-tab,roofZ(-d-tab)+sideLift],[w,-d-tab,roofZ(-d-tab)+leg+sideLift],[w,d+tab,roofZ(d+tab)+leg+sideLift]]
      }
    ];
    parts.forEach(p =&gt; {
      addFace(translated(p.horiz,p.delta),'under','var(--viz-series-4)',.72,{paint:p.paint});
      addFace(translated(p.vert,p.delta),'under','var(--viz-series-4)',.58,{paint:p.paint});
    });
    const bottomCapLip=raisedRect(-w-tab,w+tab,-d,-d+dims.frameT,leg+bottomLift);
    addFace(translated(bottomCapLip,bottomDelta),'under','var(--viz-series-4)',.88,{paint:3.8});

    if(state.downhill==='eave'){
      const edge=w+dims.eaveSideWing, hem=dims.eaveHem;
      const leftHem=[
        [-edge,bottomY1,roofZ(bottomY1)+bottomLift],[-edge,-d,roofZ(-d)+bottomLift],
        [-edge,-d,roofZ(-d)+bottomLift+hem],[-edge,bottomY1,roofZ(bottomY1)+bottomLift+hem]
      ];
      const rightHem=[
        [edge,-d,roofZ(-d)+bottomLift],[edge,bottomY1,roofZ(bottomY1)+bottomLift],
        [edge,bottomY1,roofZ(bottomY1)+bottomLift+hem],[edge,-d,roofZ(-d)+bottomLift+hem]
      ];
      addFace(translated(leftHem,bottomDelta),'under','var(--viz-series-4)',.86,{paint:3.2});
      addFace(translated(rightHem,bottomDelta),'under','var(--viz-series-4)',.86,{paint:3.2});
    }

    // The uphill flashing is a roof-plane backer/saddle pan. It runs beneath
    // the first complete tile course and discharges into both side L flashings.
    const depth=dims.backPanDepth, outlet=dims.backPanOutlet;
    const topDelta=[0,6*e,9*e];
    const backerPan=roofRect(-w-outlet,w+outlet,d,d+depth,topLift);
    const backUpstand=[
      [-w-tab,d,roofZ(d)+topLift],[w+tab,d,roofZ(d)+topLift],
      [w+tab,d,roofZ(d)+leg+topLift],[-w-tab,d,roofZ(d)+leg+topLift]
    ];
    const capLip=raisedRect(-w-tab,w+tab,d-dims.frameT,d,leg+topLift);
    addFace(translated(backerPan,topDelta),'under','var(--viz-series-4)',.80,{paint:7});
    addFace(translated(backUpstand,topDelta),'under','var(--viz-series-4)',.62,{paint:7});
    addFace(translated(capLip,topDelta),'under','var(--viz-series-4)',.88,{paint:7});

    // In the eave configuration each outlet is already part of its side-pan
    // polygon. In tile mode the folded outlet shares the side pan's exploded
    // transform, so it still reads and moves as one fabricated component.
    if(state.downhill==='tiles'){
      const outletLift=.82;
      const leftOutlet=[
        [-w-sideA,-d-sideOutlet,roofZ(-d-sideOutlet)+outletLift],
        [-w+tab,-d-sideOutlet,roofZ(-d-sideOutlet)+outletLift],
        [-w+tab,-d+1,roofZ(-d+1)+sideLift],
        [-w,-d+1,roofZ(-d+1)+sideLift],
        [-w-sideA,-d+1,roofZ(-d+1)+sideLift]
      ];
      const rightOutlet=[
        [w-tab,-d-sideOutlet,roofZ(-d-sideOutlet)+outletLift],
        [w+sideA,-d-sideOutlet,roofZ(-d-sideOutlet)+outletLift],
        [w+sideA,-d+1,roofZ(-d+1)+sideLift],
        [w,-d+1,roofZ(-d+1)+sideLift],
        [w-tab,-d+1,roofZ(-d+1)+sideLift]
      ];
      addFace(translated(leftOutlet,[-6*e,0,5*e]),'under','var(--viz-series-4)',.90,{paint:9.5});
      addFace(translated(rightOutlet,[6*e,0,5*e]),'under','var(--viz-series-4)',.90,{paint:9.5});
    }
  }

  function buildCorners() {
    if (!state.visible.corner) return;
    const w=dims.curbW/2, d=dims.curbD/2;
    const outward=7, wing=12, h=dims.underLeg, e=state.exploded?1:0;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy],i) =&gt; {
      const cx=sx*w, cy=sy*d;
      const layerLift=sy&lt;0?.14:.26;
      const paint=sy&lt;0?4:6;
      const dx=sx*8*e, dy=sy*8*e, dz=(sy&lt;0?3:7)*e;
      const outX=cx+sx*outward, innerX=cx-sx*wing;
      const outY=cy+sy*outward, innerY=cy-sy*wing;
      const delta=[dx,dy,dz];
      const baseFace=(xa,xb,ya,yb)=&gt;roofRect(Math.min(xa,xb),Math.max(xa,xb),Math.min(ya,yb),Math.max(ya,yb),layerLift);
      addFace(translated(baseFace(outX,innerX,outY,cy),delta),'corner','var(--viz-series-6)',.78,{paint});
      addFace(translated(baseFace(outX,cx,cy,innerY),delta),'corner','var(--viz-series-6)',.78,{paint});
      addFace(translated([
        [cx,cy,roofZ(cy)+layerLift],[innerX,cy,roofZ(cy)+layerLift],
        [innerX,cy,roofZ(cy)+h+layerLift],[cx,cy,roofZ(cy)+h+layerLift]
      ],delta),'corner','var(--viz-series-6)',.66,{paint});
      addFace(translated([
        [cx,innerY,roofZ(innerY)+layerLift],[cx,cy,roofZ(cy)+layerLift],
        [cx,cy,roofZ(cy)+h+layerLift],[cx,innerY,roofZ(innerY)+h+layerLift]
      ],delta),'corner','var(--viz-series-6)',.61,{paint});
    });
  }

  function buildAbove() {
    if (!state.visible.above) return;
    const w=dims.curbW/2, d=dims.curbD/2, cap=dims.aboveCap, apron=dims.aboveApron, h=dims.aboveDrop, tab=dims.tab;
    const e=state.exploded?1:0;
    const bottomTileLift=.62, sideTileLift=.70;
    const bottomTopLift=dims.curbH+bottomTileLift, sideTopLift=dims.curbH+sideTileLift;
    const parts=[
      {name:'left',paint:10,delta:[-12*e,0,15*e], cap:raisedRect(-w,-w+cap,-d-tab,d+tab,sideTopLift), drop:[[-w,-d-tab,roofZ(-d-tab)+sideTileLift],[-w,d+tab,roofZ(d+tab)+sideTileLift],[-w,d+tab,roofZ(d+tab)+sideTopLift],[-w,-d-tab,roofZ(-d-tab)+sideTopLift]], apron:raisedRect(-w-apron,-w,-d-tab,d+tab,sideTileLift)},
      {name:'right',paint:10,delta:[12*e,0,15*e], cap:raisedRect(w-cap,w,-d-tab,d+tab,sideTopLift), drop:[[w,d+tab,roofZ(d+tab)+sideTileLift],[w,-d-tab,roofZ(-d-tab)+sideTileLift],[w,-d-tab,roofZ(-d-tab)+sideTopLift],[w,d+tab,roofZ(d+tab)+sideTopLift]], apron:raisedRect(w,w+apron,-d-tab,d+tab,sideTileLift)}
    ];
    if(state.downhill==='tiles') parts.push({name:'bottom',paint:9,delta:[0,-13*e,12*e], cap:raisedRect(-w-tab,w+tab,-d,-d+cap,bottomTopLift), drop:[[w+tab,-d,roofZ(-d)+bottomTileLift],[-w-tab,-d,roofZ(-d)+bottomTileLift],[-w-tab,-d,roofZ(-d)+bottomTopLift],[w+tab,-d,roofZ(-d)+bottomTopLift]], apron:raisedRect(-w-apron,w+apron,-d-apron,-d,bottomTileLift)});
    parts.forEach(p=&gt;{
      addFace(translated(p.apron,p.delta),'above','var(--viz-series-1)',.62,{paint:p.paint});
      addFace(translated(p.drop,p.delta),'above','var(--viz-series-1)',.75,{paint:p.paint});
      addFace(translated(p.cap,p.delta),'above','var(--viz-series-1)',.84,{paint:p.paint});
    });
  }

  function buildCone() {
    if (!state.visible.cone) return;
    const w=dims.curbW/2+2, d=dims.curbD/2+2, lift=dims.curbH+.7;
    const e=state.exploded?1:0, delta=[0,0,20*e];
    addFace(translated(raisedRect(-w,w,-d,d,lift),delta),'cone','var(--viz-series-5)',.46);
    const n=20, r1=9, r2=5, coneH=7.5;
    const base=[], top=[];
    for(let i=0;i&lt;n;i++){
      const a=2*Math.PI*i/n, x=Math.cos(a), y=Math.sin(a);
      base.push(tx([r1*x,r1*y,roofZ(r1*y)+lift+.2],delta));
      top.push(tx([r2*x,r2*y,roofZ(r2*y)+lift+coneH],delta));
    }
    for(let i=0;i&lt;n;i++) addFace([base[i],base[(i+1)%n],top[(i+1)%n],top[i]],'cone','var(--viz-series-5)',.58);
    const pipeH=19;
    for(let i=0;i&lt;n;i++){
      const a1=2*Math.PI*i/n,a2=2*Math.PI*(i+1)/n;
      const p1=tx([r2*Math.cos(a1),r2*Math.sin(a1),roofZ(r2*Math.sin(a1))+lift+coneH],delta);
      const p2=tx([r2*Math.cos(a2),r2*Math.sin(a2),roofZ(r2*Math.sin(a2))+lift+coneH],delta);
      const p3=[p2[0],p2[1],p2[2]+pipeH], p4=[p1[0],p1[1],p1[2]+pipeH];
      addFace([p1,p2,p3,p4],'cone','var(--viz-series-5)',.44);
    }
  }

  function addDefinitions() {
    const defs=el('defs',{},svg);
    const marker=el('marker',{id:'cad-arrow',viewBox:'0 0 10 10',refX:'5',refY:'5',markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'},defs);
    el('path',{d:'M 0 5 L 9 1 L 7 5 L 9 9 Z',fill:'var(--foreground)'},marker);
    const waterMarker=el('marker',{id:'cad-water-arrow',viewBox:'0 0 10 10',refX:'5',refY:'5',markerWidth:'6',markerHeight:'6',orient:'auto'},defs);
    el('path',{d:'M 0 1 L 9 5 L 0 9 Z',fill:'var(--blue)'},waterMarker);
  }

  function drawFaces() {
    const defaultPaint={opening:0,roof:1,curb:2,under:5,corner:6,tile:8,above:10,cone:11};
    faces.sort((a,b)=&gt;{
      const paintDelta=(a.paint??defaultPaint[a.part]??5)-(b.paint??defaultPaint[b.part]??5);
      if(paintDelta) return paintDelta;
      const da=a.points.reduce((s,p)=&gt;{const q=viewPoint(p);return s+q[0]+q[1]+q[2]*.18;},0)/a.points.length;
      const db=b.points.reduce((s,p)=&gt;{const q=viewPoint(p);return s+q[0]+q[1]+q[2]*.18;},0)/b.points.length;
      return da-db;
    });
    faces.forEach(f=&gt;{
      const poly=el('polygon',{points:pointString(f.points),class:'cad-face',fill:f.fill,opacity:f.opacity,'data-part':f.part});
      if(f.part==='roof') poly.setAttribute('stroke','var(--muted-foreground)');
    });
  }

  function guideLine(a,b){
    const pa=project(a),pb=project(b);
    el('line',{x1:pa.x,y1:pa.y,x2:pb.x,y2:pb.y,class:'cad-guide'},notes);
  }
  function tag(letter,p){
    const q=project(p);
    const radius=letter.length&gt;1?14:10;
    el('circle',{cx:q.x,cy:q.y,r:radius,class:'cad-tag'},notes);
    const t=el('text',{x:q.x,y:q.y,class:'cad-tag-text'},notes); t.textContent=letter;
  }
  function label(text,x,y,cls='cad-label',anchor='start'){
    const t=el('text',{x,y,class:cls,'text-anchor':anchor},notes); t.textContent=text; return t;
  }

  function drawNotes() {
    const e=state.exploded?1:0, w=dims.curbW/2, d=dims.curbD/2, sideTileLift=.70;
    if(state.exploded){
      guideLine([-w,0,roofZ(0)+1],[-w-12,0,roofZ(0)+15]);
      guideLine([w,0,roofZ(0)+2],[w+12,0,roofZ(0)+15]);
      guideLine([0,0,dims.curbH+1],[0,0,dims.curbH+21]);
    }
    if(state.visible.under) {
      const td=dims.backPanDepth, to=dims.backPanOutlet;
      const leftFlow=[
        [0,d+td-2+6*e,roofZ(d+td-2+6*e)+9*e+1],
        [-2,d+4+6*e,roofZ(d+4+6*e)+9*e+1],
        [-w-to+1,d+1+6*e,roofZ(d+1+6*e)+9*e+1]
      ];
      const rightFlow=[
        [0,d+td-2+6*e,roofZ(d+td-2+6*e)+9*e+1],
        [2,d+4+6*e,roofZ(d+4+6*e)+9*e+1],
        [w+to-1,d+1+6*e,roofZ(d+1+6*e)+9*e+1]
      ];
      el('polyline',{points:pointString(leftFlow),class:'cad-water'},notes);
      el('polyline',{points:pointString(rightFlow),class:'cad-water'},notes);
      const leftSide=[
        [-w-dims.sideUnderApron*.5-6*e,d-3,roofZ(d-3)+5*e+1],
        [-w-dims.sideUnderApron*.5-6*e,-d-3,roofZ(-d-3)+5*e+1]
      ];
      const rightSide=[
        [w+dims.sideUnderApron*.5+6*e,d-3,roofZ(d-3)+5*e+1],
        [w+dims.sideUnderApron*.5+6*e,-d-3,roofZ(-d-3)+5*e+1]
      ];
      el('polyline',{points:pointString(leftSide),class:'cad-water'},notes);
      el('polyline',{points:pointString(rightSide),class:'cad-water'},notes);

      if(state.downhill==='eave'){
        const eaveY=-dims.roofD/2;
        const apronFlowLeft=[
          [-w*.55,-d-2-6*e,roofZ(-d-2-6*e)+1*e+.8],
          [-w*.55,eaveY+2-6*e,roofZ(eaveY+2-6*e)+1*e+.8]
        ];
        const apronFlowRight=[
          [w*.55,-d-2-6*e,roofZ(-d-2-6*e)+1*e+.8],
          [w*.55,eaveY+2-6*e,roofZ(eaveY+2-6*e)+1*e+.8]
        ];
        el('polyline',{points:pointString(apronFlowLeft),class:'cad-water'},notes);
        el('polyline',{points:pointString(apronFlowRight),class:'cad-water'},notes);
      }
    }

    if(state.downhill==='eave'){
      const eaveY=-dims.roofD/2;
      const eaveLeft=project([-w-dims.eaveSideWing,eaveY,roofZ(eaveY)+.25]);
      const eaveRight=project([w+dims.eaveSideWing,eaveY,roofZ(eaveY)+.25]);
      el('line',{x1:eaveLeft.x,y1:eaveLeft.y,x2:eaveRight.x,y2:eaveRight.y,class:'cad-edge'},notes);
    }
  }

  function render(announce = true) {
    viewportW=Math.max(320,Math.round(root.getBoundingClientRect().width||736));
    viewportH=viewportW&lt;520?560:600;
    svg.setAttribute('viewBox',`0 0 ${viewportW} ${viewportH}`);
    svg.style.height=`${viewportH}px`;
    scale=Math.min(viewportW/126,viewportH/106);
    originX=viewportW*.5;
    originY=viewportW&lt;520?330:355;
    scene.replaceChildren(); notes.replaceChildren();
    if(!svg.querySelector('defs')) addDefinitions();
    faces.length=0;
    buildRoof(); buildCurb(); buildUnder(); buildCorners(); buildAbove(); buildCone();
    drawFaces(); drawNotes();
    angleValue.textContent=`${Math.round(state.rotation)}°`;
    const downhillText=state.downhill==='eave'?`pink base apron to eave · ${dims.eaveSideWing} in side wings · ${dims.eaveHem} in upturned hems · no bottom B`:'blue downhill apron laps onto tile';
    if(announce) readout.textContent=`Parametric study · 700 mm (${dims.curbW.toFixed(1)} in) finished width across slope × ${dims.curbD} in down slope · ${dims.backPanDepth} in uphill backer/saddle pan · ${dims.sideUnderApron} in concealed pink side pans · tiles held back ${dims.tileHoldback} in at uphill curb · ${downhillText} · frame outside matches opening · ${dims.curbH} in curb rise · ${Math.round(state.pitch*12)}:12 pitch · ${Math.round(state.rotation)}° rotation · ${state.exploded?'exploded':'assembled'} view`;
  }

  const normalizeRotation = value =&gt; ((value % 360) + 360) % 360;
  const setRotation = (value, announce = false) =&gt; {
    state.rotation=normalizeRotation(value);
    rotationSlider.value=String(state.rotation);
    render(announce);
  };
  const queueRotation = value =&gt; {
    pendingRotation=value;
    if(rotationFrame) return;
    rotationFrame=requestAnimationFrame(()=&gt;{
      rotationFrame=0;
      if(pendingRotation!==null){
        const next=pendingRotation;
        pendingRotation=null;
        setRotation(next,false);
      }
    });
  };
  const finishDrag = event =&gt; {
    if(!dragState || (event &amp;&amp; event.pointerId!==dragState.pointerId)) return;
    const completedDrag=dragState;
    dragState=null;
    if(rotationFrame){ cancelAnimationFrame(rotationFrame); rotationFrame=0; }
    if(pendingRotation!==null){
      state.rotation=normalizeRotation(pendingRotation);
      rotationSlider.value=String(state.rotation);
      pendingRotation=null;
    }
    try{
      if(svg.hasPointerCapture?.(completedDrag.pointerId)) svg.releasePointerCapture(completedDrag.pointerId);
    }catch{}
    svg.classList.remove('is-dragging');
    render(true);
  };
  svg.addEventListener('pointerdown',event=&gt;{
    if(event.pointerType==='mouse' &amp;&amp; event.button!==0) return;
    dragState={pointerId:event.pointerId,startX:event.clientX,startRotation:state.rotation};
    try{ svg.setPointerCapture?.(event.pointerId); }catch{}
    svg.classList.add('is-dragging');
  });
  window.addEventListener('pointermove',event=&gt;{
    if(!dragState || event.pointerId!==dragState.pointerId) return;
    const deltaX=event.clientX-dragState.startX;
    if(Math.abs(deltaX)&lt;2) return;
    if(event.cancelable) event.preventDefault();
    queueRotation(dragState.startRotation+deltaX*.55);
  });
  window.addEventListener('pointerup',finishDrag);
  window.addEventListener('pointercancel',finishDrag);
  svg.addEventListener('lostpointercapture',finishDrag);

  const setMode = exploded =&gt; {
    state.exploded=exploded;
    const a=root.querySelector('#cad-exploded'),b=root.querySelector('#cad-assembled');
    a.setAttribute('aria-pressed',String(exploded)); b.setAttribute('aria-pressed',String(!exploded));
    a.classList.toggle('btn-primary',exploded); b.classList.toggle('btn-primary',!exploded);
    render();
  };
  root.querySelector('#cad-exploded').addEventListener('click',()=&gt;setMode(true));
  root.querySelector('#cad-assembled').addEventListener('click',()=&gt;setMode(false));
  root.querySelector('#cad-pitch').addEventListener('change',e=&gt;{state.pitch=Number(e.target.value);render();});
  root.querySelector('#cad-tiles').addEventListener('change',e=&gt;{state.tiles=e.target.checked;render();});
  rotationSlider.addEventListener('input',e=&gt;setRotation(Number(e.target.value),false));
  rotationSlider.addEventListener('change',()=&gt;render(true));
  root.querySelector('#cad-downhill').addEventListener('change',e=&gt;{state.downhill=e.target.value;render();});
  root.querySelectorAll('.cad-key-item').forEach(button=&gt;button.addEventListener('click',()=&gt;{
    const part=button.dataset.part; state.visible[part]=!state.visible[part];
    button.setAttribute('aria-pressed',String(state.visible[part])); render();
  }));
  new ResizeObserver(()=&gt;render(false)).observe(root);
  render();
})();

  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;

  let skipDelayUntil = 0;

    target?.nodeType === Node.ELEMENT_NODE

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;

        offset(tooltipGap),

        shift({ padding: tooltipGap }),

            );

      .then(({ x, y }) =&gt; {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);

    }

    }

    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {

    }

    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||

    window.setTimeout(() =&gt; {

  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    const trigger = getTrigger(event.target);

})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
